server {
    listen 8080;
    server_name _;

    # Liveness probe — nginx itself answering means the container is up
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Readiness probe — all services must be up
    location = /readyz {
        proxy_pass http://localhost:8091/v1/status;
        proxy_read_timeout 5s;
    }

    # REST API
    location /v1/ {
        proxy_pass         http://localhost:8091/v1/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # MCP — streamable HTTP (POST + GET on /mcp)
    # Long-lived connections: no buffering, extended timeouts
    location /mcp {
        proxy_pass            http://localhost:8079;
        proxy_http_version    1.1;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      Connection '';
        proxy_buffering       off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    # Module MCP endpoints — sidecars register as /modules/<name>/mcp
    # Convention: every module exposes its MCP server on port 8080.
    # nginx resolves <name> by Docker DNS (127.0.0.11) on sandbox-net.
    location ~ ^/modules/([^/]+)/(.*)$ {
        resolver           127.0.0.11 valid=10s;
        set $module        $1;
        set $remainder     $2;
        proxy_pass         http://$module:8080/$remainder;
        proxy_http_version 1.1;
        proxy_set_header   Host $module;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }
}
