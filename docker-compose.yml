# ---------------------------------------------------------------------------
# pesnik/sandbox — core container
#
# Usage:
#   docker compose up                         # core only
#   docker compose -f docker-compose.yml \
#     -f modules/whatsapp/docker-compose.yml up   # core + whatsapp sidecar
# ---------------------------------------------------------------------------

services:
  sandbox:
    build:
      context: ./core
      dockerfile: Dockerfile
    image: pesnik/sandbox:latest
    container_name: sandbox
    ports:
      - "${NGINX_PORT:-8180}:8080"   # nginx gateway (healthz, /v1/, /mcp)
      - "${API_PORT:-8192}:8091"     # REST API direct
      - "${MCP_PORT:-8179}:8079"     # MCP streamable-HTTP direct
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Module confs — sidecars mount .conf files here
      - ./modules:/sandbox/modules:ro
      # Org overlay — gitignored, org-specific scripts + vault.env
      - ./org:/sandbox/org:ro
      # Persist /root across restarts (git config, ssh keys, vault token, etc.)
      - sandbox-home:/root
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  sandbox-home:
    name: sandbox-home

networks:
  default:
    name: sandbox-net
